<div class="rc-login">
  <mat-card class="rc-login__card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>ResiCare</mat-card-subtitle>
    </mat-card-header>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-content>
      <form class="rc-login__form" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (error()) {
          <p class="rc-login__error">{{ error() }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">Se connecter</button>
      </form>

      <p class="rc-login__hint">
        Comptes de démonstration :<br />
        Responsable — <code>marie.curie&#64;resicare.local</code> / <code>Manager123!</code><br />
        Soignant — <code>paul.durand&#64;resicare.local</code> / <code>Soignant123!</code>
      </p>
    </mat-card-content>
  </mat-card>
</div>
